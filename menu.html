<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Breads · Kafri Artisan Breads</title>
<meta name="description" content="The full Kafri Artisan Breads catalog: sourdough, the fall collection, challah and babka. Baked in small batches in Tenafly, NJ.">
<meta name="theme-color" content="#12283f">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1B3A5B; --blue-deep:#12283f; --cream:#F5EFE3; --paper:#FBF8F2; --terra:#C9763C; --terra-dark:#a85f2c;
  --ink:#24303d; --ink-soft:#5d6875; --line:#E6DCCB; --chip:#EFE5D4;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--paper);color:var(--ink);font-family:'Lato',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
html[lang="he"] body{font-family:'Heebo',system-ui,sans-serif;}
h1,h2,h3{font-family:'Frank Ruhl Libre',Georgia,serif;font-weight:700;}
a{color:inherit;}

/* top bar */
.top{background:var(--blue-deep);color:var(--cream);}
.top-in{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.top a{text-decoration:none;font-size:14px;opacity:.85;}
.top a:hover{opacity:1;}
.brand{font-family:'Frank Ruhl Libre',serif;font-size:18px;opacity:1 !important;}
.lang-btn{background:none;border:1px solid rgba(245,239,227,.35);color:var(--cream);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;}

/* hero */
.hero{background:var(--blue-deep);color:var(--cream);text-align:center;padding:26px 20px 34px;}
.hero h1{font-size:clamp(32px,6vw,46px);line-height:1.1;}
.hero p{max-width:560px;margin:10px auto 0;color:rgba(245,239,227,.78);font-size:16px;line-height:1.6;}

/* section nav */
.nav{position:sticky;top:0;z-index:5;background:rgba(251,248,242,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
.nav-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
.nav-in::-webkit-scrollbar{display:none;}
.nav a{flex-shrink:0;text-decoration:none;font-size:14px;padding:8px 14px;border-radius:999px;background:var(--chip);color:var(--blue);font-weight:700;white-space:nowrap;}
.nav a small{font-weight:400;color:var(--ink-soft);margin-inline-start:6px;}

/* sections */
main{max-width:1080px;margin:0 auto;padding:8px 16px 40px;}
.sec{padding-top:26px;scroll-margin-top:60px;}
.banner{position:relative;border-radius:18px;overflow:hidden;min-height:190px;display:flex;align-items:flex-end;background:var(--blue) center/cover no-repeat;color:var(--cream);}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,40,63,.15) 0%,rgba(18,40,63,.85) 100%);}
.banner-in{position:relative;padding:22px;width:100%;display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.banner h2{font-size:clamp(26px,4.5vw,34px);line-height:1.1;}
.banner .day{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;letter-spacing:.04em;color:#F3C9A5;}
.banner p{margin-top:6px;font-size:14px;color:rgba(245,239,227,.85);max-width:520px;line-height:1.5;}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:var(--terra);color:#fff;font-weight:700;font-size:15px;padding:11px 18px;border-radius:12px;white-space:nowrap;transition:background .2s;}
.btn:hover{background:var(--terra-dark);}
html[dir="rtl"] .arr{transform:scaleX(-1);display:inline-block;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:18px;}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;}
.ph{aspect-ratio:4/3;background:var(--cream);position:relative;overflow:hidden;}
.ph img{width:100%;height:100%;object-fit:cover;display:block;}
.ph.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#b9a68a;
  background:radial-gradient(circle at 30% 20%,#fff8ec 0%,var(--cream) 60%,#ece1cd 100%);}
.ph.empty svg{width:54px;height:54px;opacity:.7;}
.ph.empty span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;}
.price{position:absolute;top:10px;inset-inline-end:10px;background:rgba(255,255,255,.94);color:var(--blue);font-weight:700;font-size:15px;padding:4px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1;}
.card h3{font-size:19px;line-height:1.25;color:var(--blue);}
.sub{font-size:12px;color:var(--ink-soft);margin-top:3px;}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--terra-dark);}
.desc{font-size:14px;line-height:1.6;color:var(--ink-soft);margin-top:9px;}
details{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;}
summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--blue);list-style:none;}
summary::-webkit-details-marker{display:none;}
summary::after{content:" ▾";font-size:10px;}
details[open] summary::after{content:" ▴";}
.k{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--terra);margin-top:10px;}
html[lang="he"] .k{letter-spacing:0;font-size:12px;}
.v{font-size:13px;line-height:1.55;color:var(--ink-soft);margin-top:2px;}
.nut{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px;}
.nut div{background:var(--paper);border:1px solid var(--line);border-radius:8px;text-align:center;padding:6px 2px;}
.nut b{display:block;font-size:14px;color:var(--blue);}
.nut i{font-style:normal;font-size:10px;color:var(--ink-soft);}
.card.special{border:2px solid var(--terra);}
.card.special .badge{background:var(--terra);color:#fff;}
.order{margin-top:auto;padding-top:14px;}
.order .btn{width:100%;justify-content:center;font-size:14px;padding:10px 14px;background:var(--blue);}
.order .btn:hover{background:var(--blue-deep);}

footer{text-align:center;padding:26px 16px 40px;color:var(--ink-soft);font-size:13px;}
footer a{color:var(--blue);font-weight:700;}
@media(max-width:560px){
  .banner-in{padding:18px;}.btn{font-size:14px;}
  .grid{grid-template-columns:1fr;gap:12px;}
  .card{display:grid;grid-template-columns:112px 1fr;}
  .ph{aspect-ratio:auto;min-height:100%;}
  .ph.empty span{display:none;}
  .ph.empty svg{width:34px;height:34px;}
  .price{top:8px;inset-inline-end:auto;inset-inline-start:8px;font-size:13px;padding:3px 8px;}
  .body{padding:12px 14px 14px;}
  .card h3{font-size:17px;}
  .desc{font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  details[open] ~ .order, .order{grid-column:1 / -1;}
}
</style>
</head>
